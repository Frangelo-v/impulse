[package]
name    = "impulsec"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "impulsec"
path = "src/main.rs"

[dependencies]
# Lexer: zero-copy, regex-based tokenizer
logos = "0.14"

# Error reporting with source spans
miette = { version = "7", features = ["fancy"] }
thiserror = "1"

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# std/http: blocking HTTP client for bots (TLS via rustls, no system deps)
ureq = "2"

[profile.release]
opt-level = 3
lto       = true
