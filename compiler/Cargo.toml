[package]
name    = "impulsec"
version = "0.1.0-beta.1"
edition = "2021"

[[bin]]
name = "impulsec"
path = "src/main.rs"

[dependencies]
# Lexer: tokenizer basado en regex
logos = "0.14"

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# std/http: blocking HTTP client for bots (TLS via rustls, no system deps)
ureq = "2"

# std/json: parse API responses (Telegram, REST) into native maps/lists
serde_json = "1"

